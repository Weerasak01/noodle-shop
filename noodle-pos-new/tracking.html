<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สถานะออร์เดอร์ของคุณ - ร้านเจ๊ A</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen pb-20">

  <!-- Header -->
  <header class="bg-red-600 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 class="text-base font-bold">📋 สถานะออร์เดอร์ของคุณ</h1>
      <span class="bg-white text-red-600 px-3 py-1 rounded-full text-sm font-bold shadow">โต๊ะ 01</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-md mx-auto p-4 space-y-4">
    <div id="orders-container" class="space-y-4">
      <div class="bg-white rounded-2xl p-6 shadow text-center text-gray-400">
        กำลังโหลดข้อมูลออร์เดอร์...
      </div>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://bofbcqfavxbydzmfhhdi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvZmJjcWZhdnhieWR6bWZoaGRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNzgyNDMsImV4cCI6MjEwODY1NDI0M30.NazP38z1ligYp9S0gChRZs9JYNabN6YX4akJe84ai7o';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const tableNo = 'โต๊ะ 01';

    // แปลงสถานะเป็นข้อความและสีที่สวยงาม
    function getStatusBadge(status) {
      switch (status) {
        case 'new':
          return `<span class="bg-yellow-100 text-yellow-800 px-3 py-1 rounded-full text-xs font-bold inline-block">⏳ รอห้องครัวรับออร์เดอร์</span>`;
        case 'cooking':
          return `<span class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-xs font-bold inline-block">🔥 กำลังทำอาหาร</span>`;
        case 'ready':
          return `<span class="bg-green-100 text-green-800 px-3 py-1 rounded-full text-xs font-bold inline-block">🎉 อาหารพร้อมเสิร์ฟแล้ว!</span>`;
        default:
          return `<span class="bg-gray-100 text-gray-800 px-3 py-1 rounded-full text-xs font-bold inline-block">เสร็จสิ้น</span>`;
      }
    }

    async function fetchOrders() {
      const container = document.getElementById('orders-container');
      
      const { data, error } = await supabaseClient
        .from('orders')
        .select('*')
        .eq('table_no', tableNo)
        .in('status', ['new', 'cooking', 'ready'])
        .order('id', { ascending: false });

      if (error) {
        container.innerHTML = `<div class="bg-white rounded-2xl p-6 shadow text-center text-red-500">เกิดข้อผิดพลาดในการโหลดข้อมูล</div>`;
        return;
      }

      if (!data || data.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-8 shadow text-center space-y-3">
            <p class="text-gray-500 font-medium">ยังไม่มีรายการออร์เดอร์ในขณะนี้</p>
            <a href="custmer.html" class="inline-block bg-red-600 text-white px-6 py-2.5 rounded-xl font-bold text-sm shadow hover:bg-red-700 transition">ไปหน้าสั่งอาหาร</a>
          </div>`;
        return;
      }

      container.innerHTML = '';

      data.forEach(order => {
        // จัดการ items (รองรับทั้งแบบที่เป็น string JSON หรือแบบที่เป็น Array อยู่แล้ว)
        let itemsList = [];
        try {
          itemsList = typeof order.items === 'string' ? JSON.parse(order.items) : order.items;
        } catch (e) {
          itemsList = [];
        }

        let itemsHtml = '';
        if (Array.isArray(itemsList)) {
          itemsList.forEach(item => {
            itemsHtml += `
              <div class="border-b pb-2 mb-2 last:border-b-0 last:pb-0 last:mb-0 flex justify-between items-start">
                <div>
                  <h4 class="font-bold text-gray-800 text-base">${item.menu_name} <span class="text-red-600 font-normal text-sm">x ${item.quantity}</span></h4>
                  <p class="text-xs text-gray-500">ตัวเลือก: ${item.noodle || '-'} / ${item.soup || '-'}</p>
                  ${item.note ? `<p class="text-xs text-red-500 font-medium">หมายเหตุ: ${item.note}</p>` : ''}
                </div>
                <div class="text-right">
                  <span class="font-bold text-gray-700 text-sm">฿${item.total_price || (item.price_per_unit * item.quantity)}</span>
                </div>
              </div>
            `;
          });
        }

        container.innerHTML += `
          <div class="bg-white rounded-2xl p-5 shadow space-y-4 border border-gray-100">
            <div class="flex justify-between items-center border-b pb-3">
              <span class="text-xs text-gray-400 font-mono">ออร์เดอร์ ID: #${order.id}</span>
              <div>${getStatusBadge(order.status)}</div>
            </div>

            <!-- รายการอาหารข้างใน -->
            <div class="space-y-3 bg-gray-50 p-3 rounded-xl">
              ${itemsHtml}
            </div>

            <div class="flex justify-between items-center pt-2 border-t text-sm font-bold">
              <span class="text-gray-600">ยอดรวมทั้งสิ้น:</span>
              <span class="text-red-600 text-lg">฿${order.total_price}</span>
            </div>
          </div>
        `;
      });
    }

    // โหลดข้อมูลตอนเปิดหน้า และรีเฟรชอัตโนมัติทุกๆ 5 วินาที
    fetchOrders();
    setInterval(fetchOrders, 5000);
  </script>
</body>
</html>
