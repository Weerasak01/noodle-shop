<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แปลนโต๊ะภาพรวมร้าน (Table Management)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 sm:p-6 pb-24">

  <!-- Header -->
  <header class="max-w-5xl mx-auto mb-6 bg-gray-800 p-4 rounded-2xl shadow-lg flex flex-col sm:flex-row justify-between items-center border border-gray-700 gap-4">
    <div>
      <h1 id="shop-title" class="text-xl font-bold text-yellow-400">🗺️ แปลนโต๊ะภาพรวมร้านอาหาร</h1>
      <p class="text-xs text-gray-400">จัดการสถานะโต๊ะ ออร์เดอร์กลับบ้าน/เดลิเวอรี่ และปรับแต่งจำนวนโต๊ะ</p>
    </div>
    
    <!-- ส่วนตั้งค่าจำนวนโต๊ะ -->
    <div class="flex items-center gap-2 bg-gray-900 px-4 py-2 rounded-xl border border-gray-700">
      <label class="text-xs font-bold text-gray-300">จำนวนโต๊ะทั้งหมด:</label>
      <input type="number" id="total-tables-input" min="1" max="100" class="w-16 bg-gray-800 border border-gray-600 rounded-lg px-2 py-1 text-center font-bold text-yellow-400 text-sm focus:outline-none focus:border-yellow-500" value="10">
      <button onclick="updateTotalTables()" class="bg-yellow-500 hover:bg-yellow-600 text-gray-950 font-bold px-3 py-1 rounded-lg text-xs transition">
        บันทึก
      </button>
    </div>
  </header>

  <!-- Main Content: Takeaway & Table Grid -->
  <main class="max-w-5xl mx-auto space-y-6">
    
    <!-- 🛍️ โซนออร์เดอร์กลับบ้าน / เดลิเวอรี่ -->
    <div class="bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-700">
      <h2 class="text-lg font-bold text-yellow-400 mb-4">🛍️ ออร์เดอร์กลับบ้าน & เดลิเวอรี่ (รอดำเนินการ)</h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4" id="takeaway-grid">
        <p class="text-gray-400 text-xs col-span-full py-2">กำลังโหลดข้อมูล...</p>
      </div>
    </div>

    <!-- 📍 โซนโต๊ะอาหารปกติ -->
    <div class="bg-gray-800 p-6 rounded-2xl shadow-lg border border-gray-700">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-white">📍 สถานะโต๊ะอาหารในร้าน</h2>
        <div class="flex items-center space-x-4 text-xs font-bold">
          <span class="flex items-center space-x-1"><span class="w-3 h-3 bg-green-500 rounded-full inline-block"></span><span class="text-gray-300">โต๊ะว่าง</span></span>
          <span class="flex items-center space-x-1"><span class="w-3 h-3 bg-yellow-500 rounded-full inline-block"></span><span class="text-gray-300">มีออร์เดอร์/กำลังทาน</span></span>
        </div>
      </div>

      <!-- Grid แสดงโต๊ะตามจำนวนที่ตั้งค่า -->
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4" id="tables-grid">
        <!-- Rendered by JS -->
      </div>
    </div>
  </main>

  <!-- Modal สำหรับดูรายละเอียดโต๊ะหรือออร์เดอร์ -->
  <div id="table-modal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-gray-800 text-white w-full max-w-md rounded-2xl p-6 shadow-2xl border border-gray-700 space-y-4">
      <div class="flex justify-between items-center border-b border-gray-700 pb-3">
        <h3 id="modal-table-title" class="text-lg font-bold text-yellow-400">รายละเอียดออร์เดอร์</h3>
        <button onclick="closeTableModal()" class="text-gray-400 hover:text-white text-2xl font-bold">&times;</button>
      </div>

      <div id="modal-order-content" class="space-y-2 max-h-60 overflow-y-auto pr-1 text-sm">
        <!-- รายการอาหาร -->
      </div>

      <div class="border-t border-gray-700 pt-3 flex justify-between items-center font-bold">
        <span class="text-gray-400">ยอดรวมทั้งสิ้น:</span>
        <span class="text-yellow-400 text-lg">฿<span id="modal-grand-total">0</span></span>
      </div>

      <div id="modal-action-btn" class="pt-2">
        <!-- ปุ่มชำระเงิน -->
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://bofbcqfavxbydzmfhhdi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvZmJjcWZhdnhieWR6bWZoaGRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNzgyNDMsImV4cCI6MjEwODY1NDI0M30.NazP38z1ligYp9S0gChRZs9JYNabN6YX4akJe84ai7o';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let activeOrdersMap = {};
    let specialOrdersList = [];
    let allActiveOrdersData = [];
    let totalTablesCount = 10; // ค่าเริ่มต้น

    // โหลดชื่อร้านและจำนวนโต๊ะจากตาราง settings
    async function loadSettings() {
      const { data } = await supabaseClient.from('settings').select('*');
      if (data) {
        data.forEach(item => {
          if (item.key === 'shop_name' && item.value) {
            document.getElementById('shop-title').innerText = `🗺️ แปลนโต๊ะภาพรวมร้าน - ${item.value}`;
          }
          if (item.key === 'total_tables' && item.value) {
            totalTablesCount = parseInt(item.value) || 10;
            document.getElementById('total-tables-input').value = totalTablesCount;
          }
        });
      }
      loadTableStatus();
    }

    // ฟังก์ชันบันทึกจำนวนโต๊ะใหม่ลงฐานข้อมูล
    async function updateTotalTables() {
      const newCount = parseInt(document.getElementById('total-tables-input').value);
      if (!newCount || newCount < 1 || newCount > 100) {
        alert('กรุณากรอกจำนวนโต๊ะให้อยู่ระหว่าง 1 ถึง 100');
        return;
      }

      const { error } = await supabaseClient
        .from('settings')
        .upsert({ key: 'total_tables', value: newCount.toString() }, { onConflict: 'key' });

      if (error) {
        alert('บันทึกจำนวนโต๊ะไม่สำเร็จ: ' + error.message);
      } else {
        totalTablesCount = newCount;
        alert(`อัปเดตจำนวนโต๊ะเป็น ${newCount} โต๊ะเรียบร้อยแล้ว!`);
        renderTablesGrid();
      }
    }

    // โหลดข้อมูลออร์เดอร์ทั้งหมดที่ยังไม่เสร็จ
    async function loadTableStatus() {
      const { data, error } = await supabaseClient
        .from('orders')
        .select('*')
        .in('status', ['new', 'cooking', 'ready']);

      activeOrdersMap = {};
      specialOrdersList = [];
      allActiveOrdersData = data || [];

      if (data) {
        data.forEach(order => {
          if (order.table_no === '🛍️ กลับบ้าน' || order.table_no === '🛵 เดลิเวอรี่' || order.table_no.includes('กลับบ้าน') || order.table_no.includes('เดลิเวอรี่')) {
            specialOrdersList.push(order);
          } else {
            activeOrdersMap[order.table_no] = order;
          }
        });
      }

      renderSpecialOrdersGrid();
      renderTablesGrid();
    }

    // วาดกล่องกลับบ้าน/เดลิเวอรี่
    function renderSpecialOrdersGrid() {
      const container = document.getElementById('takeaway-grid');
      container.innerHTML = '';

      if (specialOrdersList.length === 0) {
        container.innerHTML = `<p class="text-gray-400 text-xs col-span-full py-2">ไม่มีออร์เดอร์กลับบ้านหรือเดลิเวอรี่ในขณะนี้</p>`;
        return;
      }

      specialOrdersList.forEach(order => {
        let statusText = order.status === 'new' ? '⏳ รอรับเรื่อง' : (order.status === 'cooking' ? '🔥 กำลังทำ' : '🎉 พร้อมรับสินค้า');
        container.innerHTML += `
          <div onclick="openModalByOrderId('${order.id}')" class="bg-red-950/40 border-2 border-red-500 rounded-2xl p-4 flex flex-col justify-between items-center cursor-pointer hover:scale-105 transition shadow-lg h-28">
            <div class="w-full flex justify-between items-center">
              <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-red-500 text-white">${order.table_no}</span>
              <span class="text-xs text-yellow-400 font-bold">฿${order.total_price}</span>
            </div>
            <div class="text-center my-auto">
              <span class="text-sm font-bold text-white">ออร์เดอร์ #${order.id}</span>
            </div>
            <div class="w-full text-center text-[10px] text-gray-300">${statusText} (คลิกดูรายละเอียด)</div>
          </div>
        `;
      });
    }

    // วาดแปลนโต๊ะตามจำนวน totalTablesCount ที่ตั้งไว้
    function renderTablesGrid() {
      const grid = document.getElementById('tables-grid');
      grid.innerHTML = '';

      for (let i = 1; i <= totalTablesCount; i++) {
        const tableKey = `โต๊ะ ${i < 10 ? '0' + i : i}`;
        const order = activeOrdersMap[tableKey];
        const isOccupied = order !== undefined;

        let statusBg = isOccupied ? 'bg-yellow-900/40 border-yellow-500 text-yellow-300' : 'bg-gray-700/50 border-gray-600 text-gray-400';
        let badgeText = isOccupied ? '🔥 มีออร์เดอร์' : '🟢 ว่าง';
        let badgeColor = isOccupied ? 'bg-yellow-500 text-gray-950' : 'bg-green-500 text-gray-950';

        grid.innerHTML += `
          <div onclick="openTableDetail('${tableKey}')" class="${statusBg} border-2 rounded-2xl p-4 flex flex-col justify-between items-center cursor-pointer hover:scale-105 transition shadow-lg h-32">
            <div class="w-full flex justify-between items-center">
              <span class="text-xs font-bold px-2 py-0.5 rounded-full ${badgeColor}">${badgeText}</span>
              ${isOccupied ? `<span class="text-xs text-yellow-400 font-bold">฿${order.total_price}</span>` : ''}
            </div>
            <div class="text-center my-auto">
              <span class="text-xl font-black">${tableKey}</span>
            </div>
            <div class="w-full text-center text-[10px] text-gray-400">
              ${isOccupied ? (order.status === 'ready' ? '🎉 พร้อมเสิร์ฟ' : '⏳ กำลังทำ') : 'พร้อมรับลูกค้า'}
            </div>
          </div>
        `;
      }
    }

    // เปิด Modal ดูรายละเอียดออร์เดอร์จากโต๊ะปกติ
    function openTableDetail(tableNo) {
      const order = activeOrdersMap[tableNo];
      const modal = document.getElementById('table-modal');
      document.getElementById('modal-table-title').innerText = `📍 รายการอาหาร: ${tableNo}`;

      const contentEl = document.getElementById('modal-order-content');
      const actionEl = document.getElementById('modal-action-btn');

      if (!order) {
        contentEl.innerHTML = `<p class="text-gray-400 text-center py-6">โต๊ะนี้ว่าง ไม่มีออร์เดอร์ค้างในขณะนี้</p>`;
        document.getElementById('modal-grand-total').innerText = '0';
        actionEl.innerHTML = '';
      } else {
        renderModalContent(order);
      }

      modal.classList.remove('hidden');
    }

    // เปิด Modal ดูรายละเอียดออร์เดอร์จาก ID (สำหรับกลับบ้าน/เดลิเวอรี่)
    function openModalByOrderId(orderId) {
      const order = allActiveOrdersData.find(o => o.id == orderId);
      if (!order) return;

      const modal = document.getElementById('table-modal');
      document.getElementById('modal-table-title').innerText = `📍 รายการ: ${order.table_no} (#${order.id})`;
      renderModalContent(order);
      modal.classList.remove('hidden');
    }

    // เรนเดอร์รายละเอียดสินค้าภายใน Modal
    function renderModalContent(order) {
      const contentEl = document.getElementById('modal-order-content');
      const actionEl = document.getElementById('modal-action-btn');

      let itemsList = [];
      try {
        itemsList = typeof order.items === 'string' ? JSON.parse(order.items) : order.items;
      } catch (e) {
        itemsList = [];
      }

      let itemsHtml = '';
      if (Array.isArray(itemsList)) {
        itemsList.forEach(item => {
          itemsHtml += `
            <div class="flex justify-between items-start border-b border-gray-700 pb-2 mb-2">
              <div>
                <span class="font-bold text-white">${item.menu_name} x ${item.quantity}</span>
                <span class="text-gray-400 block text-xs">(${item.noodle || '-'} / ${item.soup || '-'})</span>
                ${item.note ? `<span class="text-red-400 text-xs">💬 ${item.note}</span>` : ''}
              </div>
              <span class="font-bold text-yellow-400">฿${item.total_price}</span>
            </div>
          `;
        });
      }

      contentEl.innerHTML = itemsHtml;
      document.getElementById('modal-grand-total').innerText = order.total_price;
      actionEl.innerHTML = `
        <button onclick="checkoutTable('${order.id}', '${order.table_no}')" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition text-sm shadow">
          💰 ชำระเงิน & เคลียร์ (${order.table_no})
        </button>
      `;
    }

    function closeTableModal() {
      document.getElementById('table-modal').classList.add('hidden');
    }

    // ฟังก์ชันชำระเงินและเคลียร์ออร์เดอร์
    async function checkoutTable(orderId, targetName) {
      if (!confirm(`ยืนยันการชำระเงินของ ${targetName} เรียบร้อยแล้วใช่ไหมครับ?`)) return;

      const { error } = await supabaseClient
        .from('orders')
        .update({ status: 'completed' })
        .eq('id', orderId);

      if (error) {
        alert('เกิดข้อผิดพลาด: ' + error.message);
      } else {
        alert(`ชำระเงิน ${targetName} สำเร็จ!`);
        closeTableModal();
        loadTableStatus();
      }
    }

    // Realtime listener
    function setupRealtime() {
      supabaseClient
        .channel('tables-realtime')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, () => {
          loadTableStatus();
        })
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            const st = document.getElementById('connection-status');
            st.innerText = '🟢 เชื่อมต่อเรียลไทม์แล้ว';
            st.className = 'text-xs bg-gray-700 text-green-400 px-3 py-1 rounded-full font-bold';
          }
        });
    }

    // เริ่มทำงาน
    loadSettings();
    setupRealtime();
  </script>
</body>
</html>
