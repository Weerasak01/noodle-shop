<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งอาหาร - ร้านอาหาร</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 min-h-screen pb-32">

  <!-- Header -->
  <header class="bg-red-600 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 id="shop-title" class="text-base font-bold">🍜 กำลังโหลดชื่อร้าน...</h1>
      <span id="order-type-badge" class="bg-white text-red-600 px-3 py-1 rounded-full text-xs font-bold shadow">ทานที่ร้าน: โต๊ะ 01</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-md mx-auto p-4 space-y-4">
    
    <!-- กล่องเลือกประเภทการสั่งซื้อ (ทานที่ร้าน / กลับบ้าน / เดลิเวอรี่) -->
    <div class="bg-white rounded-2xl p-4 shadow-md border border-gray-200 space-y-3">
      <label class="block text-xs font-bold text-gray-700">📍 รูปแบบการสั่งซื้อ:</label>
      <div class="grid grid-cols-3 gap-2">
        <button type="button" onclick="setOrderType('dine_in')" id="type-dine-in" class="py-2 px-1 rounded-xl text-xs font-bold transition border bg-red-600 text-white border-red-600">
          🍽️ ทานที่ร้าน
        </button>
        <button type="button" onclick="setOrderType('takeaway')" id="type-takeaway" class="py-2 px-1 rounded-xl text-xs font-bold transition border bg-white text-gray-700 border-gray-300">
          🛍️ กลับบ้าน
        </button>
        <button type="button" onclick="setOrderType('delivery')" id="type-delivery" class="py-2 px-1 rounded-xl text-xs font-bold transition border bg-white text-gray-700 border-gray-300">
          🛵 เดลิเวอรี่
        </button>
      </div>

      <!-- ฟอร์มกรอกข้อมูลเพิ่มเติม -->
      <div id="customer-info-box" class="hidden space-y-2 pt-2 border-t text-xs">
        <div>
          <label class="block font-bold text-gray-600 mb-1" id="name-label">ชื่อผู้สั่ง:</label>
          <input type="text" id="cust-name" class="w-full border rounded-lg p-2 font-medium" placeholder="กรอกชื่อของคุณ">
        </div>
        <div id="phone-field">
          <label class="block font-bold text-gray-600 mb-1">เบอร์โทรศัพท์:</label>
          <input type="tel" id="cust-phone" class="w-full border rounded-lg p-2 font-medium" placeholder="เบอร์โทรติดต่อ">
        </div>
        <div id="address-field" class="hidden">
          <label class="block font-bold text-gray-600 mb-1">ที่อยู่จัดส่ง:</label>
          <textarea id="cust-address" rows="2" class="w-full border rounded-lg p-2 font-medium" placeholder="บ้านเลขที่, ซอย, ถนน, จุดสังเกต..."></textarea>
        </div>
      </div>
    </div>

    <!-- กล่องแสดงสถานะออร์เดอร์และเลขคิว (Tracking) -->
    <div id="live-order-status-container" class="hidden">
      <div class="bg-white rounded-2xl p-4 shadow-md border-2 border-red-500 space-y-3">
        <div class="flex justify-between items-center border-b pb-2">
          <span class="text-xs font-bold text-gray-500" id="order-id-label">ออร์เดอร์ # -</span>
          <div id="order-status-badge">กำลังโหลดสถานะ...</div>
        </div>
        
        <!-- ส่วนแสดงเลขคิว -->
        <div id="queue-display-box" class="bg-red-50 border border-red-200 rounded-xl p-3 text-center">
          <p class="text-xs text-gray-500 font-bold" id="queue-title-label">สถานะคิวของคุณ</p>
          <p class="text-2xl font-black text-red-600" id="queue-number-text">คิวที่ # -</p>
        </div>

        <div id="order-items-summary" class="text-xs text-gray-700 space-y-2">
          <!-- รายการย่อและคอมเมนท์ -->
        </div>
        <div class="flex justify-between items-center pt-2 border-t text-xs font-bold">
          <span class="text-gray-600">ยอดรวมออร์เดอร์:</span>
          <span class="text-red-600 text-sm">฿<span id="order-total-label">0</span></span>
        </div>
      </div>
    </div>

    <!-- แท็บหมวดหมู่สินค้า -->
    <div class="flex space-x-2 overflow-x-auto pb-2 scrollbar-none">
      <button onclick="filterCategory('ก๋วยเตี๋ยว', this)" class="category-btn bg-red-600 text-white px-4 py-2 rounded-full font-bold text-sm whitespace-nowrap shadow transition">🍜 ก๋วยเตี๋ยว</button>
      <button onclick="filterCategory('อาหาร', this)" class="category-btn bg-white text-gray-700 px-4 py-2 rounded-full font-bold text-sm whitespace-nowrap shadow transition">🍛 อาหาร</button>
      <button onclick="filterCategory('เครื่องดื่ม', this)" class="category-btn bg-white text-gray-700 px-4 py-2 rounded-full font-bold text-sm whitespace-nowrap shadow transition">🥤 เครื่องดื่ม</button>
    </div>

    <h2 id="category-title" class="text-xl font-bold text-gray-800 pt-2">เมนูก๋วยเตี๋ยว</h2>
    
    <!-- Menu List Container -->
    <div id="menu-list" class="space-y-4">
      <p class="text-gray-500 text-center py-4">กำลังโหลดเมนู...</p>
    </div>
  </main>

  <!-- Floating Cart Bar -->
  <div id="floating-cart" class="fixed bottom-0 left-0 right-0 bg-white border-t shadow-2xl p-4 hidden z-40">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <p class="text-xs text-gray-500">ตะกร้าของคุณ</p>
        <p class="text-base font-bold text-gray-800"><span id="cart-count">0</span> รายการ | <span class="text-red-600">฿<span id="cart-total">0</span></span></p>
      </div>
      <button onclick="openCartModal()" class="bg-red-600 text-white px-6 py-2.5 rounded-xl font-bold shadow-lg hover:bg-red-700 transition flex items-center space-x-2">
        <span>🛒 ดูตะกร้าสินค้า</span>
      </button>
    </div>
  </div>

  <!-- Customization Modal -->
  <div id="custom-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden z-50">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 shadow-xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-4">
        <h3 id="modal-title" class="text-lg font-bold text-gray-800">ปรับแต่งเมนู</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
      </div>

      <!-- 1. เลือกเส้น -->
      <div class="mb-4">
        <label class="block text-gray-700 font-bold mb-2">1. เลือกเส้น:</label>
        <div id="noodle-options" class="space-y-2"></div>
      </div>

      <!-- 2. เลือกน้ำซุป / แบบ -->
      <div class="mb-4">
        <label class="block text-gray-700 font-bold mb-2">2. เลือกน้ำซุป / แบบ:</label>
        <div id="soup-options" class="space-y-2"></div>
      </div>

      <!-- 3. เลือกจำนวน -->
      <div class="mb-4">
        <label class="block text-gray-700 font-bold mb-2">3. จำนวน:</label>
        <div class="flex items-center space-x-3">
          <button type="button" onclick="adjustQty(-1)" class="bg-gray-200 px-4 py-2 rounded-lg font-bold text-lg hover:bg-gray-300">-</button>
          <input type="number" id="item-quantity" value="1" min="1" class="w-20 text-center border rounded-lg py-2 font-bold text-lg" onchange="updateModalPrice()">
          <button type="button" onclick="adjustQty(1)" class="bg-gray-200 px-4 py-2 rounded-lg font-bold text-lg hover:bg-gray-300">+</button>
        </div>
      </div>

      <!-- หมายเหตุเพิ่มเติม -->
      <div class="mb-6">
        <label class="block text-gray-700 font-bold mb-2">หมายเหตุเพิ่มเติม (คอมเมนต์ถึงครัว):</label>
        <textarea id="customer-note" rows="2" class="w-full border rounded-lg p-2 text-sm focus:ring-2 focus:ring-red-500 focus:outline-none" placeholder="เช่น ไม่ใส่ถั่วงอก, หวานน้อย..."></textarea>
      </div>

      <button id="add-to-cart-btn" onclick="addToCart()" class="w-full bg-red-600 text-white py-3 rounded-xl font-bold text-lg shadow-lg hover:bg-red-700 transition">
        เพิ่มลงตะกร้า (฿0)
      </button>
    </div>
  </div>

  <!-- Cart Summary Modal -->
  <div id="cart-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden z-50">
    <div class="bg-white w-full max-w-md rounded-t-2xl sm:rounded-2xl p-6 shadow-xl max-h-[90vh] overflow-y-auto flex flex-col">
      <div class="flex justify-between items-center mb-4 border-b pb-3">
        <h3 class="text-lg font-bold text-gray-800">🛒 ตะกร้าสินค้าของคุณ</h3>
        <button onclick="closeCartModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
      </div>

      <!-- รายการสินค้าในตะกร้า -->
      <div id="cart-items-container" class="space-y-3 overflow-y-auto max-h-[50vh] mb-4 flex-1">
        <!-- Render by JS -->
      </div>

      <div class="border-t pt-3 mb-4">
        <div class="flex justify-between text-lg font-bold text-gray-800">
          <span>ยอดรวมทั้งสิ้น:</span>
          <span class="text-red-600">฿<span id="cart-modal-total">0</span></span>
        </div>
      </div>

      <button onclick="submitAllOrders()" class="w-full bg-red-600 text-white py-3 rounded-xl font-bold text-lg shadow-lg hover:bg-red-700 transition">
        ยืนยันสั่งอาหารทั้งหมดเข้าครัว
      </button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://bofbcqfavxbydzmfhhdi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvZmJjcWZhdnhieWR6bWZoaGRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNzgyNDMsImV4cCI6MjEwODY1NDI0M30.NazP38z1ligYp9S0gChRZs9JYNabN6YX4akJe84ai7o';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const urlParams = new URLSearchParams(window.location.search);
    let tableNo = urlParams.get('table') || 'โต๊ะ 01';
    let orderMode = 'dine_in'; // dine_in, takeaway, delivery

    document.getElementById('order-type-badge').innerText = `ทานที่ร้าน: ${tableNo}`;

    let menusData = [];
    let currentCategory = 'ก๋วยเตี๋ยว';
    let currentMenu = null;
    let cart = [];

    // ฟังก์ชันสลับโหมดการสั่งซื้อ
    function setOrderType(mode) {
      orderMode = mode;
      const btnDine = document.getElementById('type-dine-in');
      const btnTake = document.getElementById('type-takeaway');
      const btnDeli = document.getElementById('type-delivery');
      const infoBox = document.getElementById('customer-info-box');
      const phoneField = document.getElementById('phone-field');
      const addressField = document.getElementById('address-field');
      const badge = document.getElementById('order-type-badge');

      [btnDine, btnTake, btnDeli].forEach(b => {
        b.className = 'py-2 px-1 rounded-xl text-xs font-bold transition border bg-white text-gray-700 border-gray-300';
      });

      if (mode === 'dine_in') {
        btnDine.className = 'py-2 px-1 rounded-xl text-xs font-bold transition border bg-red-600 text-white border-red-600';
        infoBox.classList.add('hidden');
        badge.innerText = `ทานที่ร้าน: ${tableNo}`;
      } else if (mode === 'takeaway') {
        btnTake.className = 'py-2 px-1 rounded-xl text-xs font-bold transition border bg-red-600 text-white border-red-600';
        infoBox.classList.remove('hidden');
        phoneField.classList.add('hidden');
        addressField.classList.add('hidden');
        badge.innerText = `🛍️ กลับบ้าน`;
      } else if (mode === 'delivery') {
        btnDeli.className = 'py-2 px-1 rounded-xl text-xs font-bold transition border bg-red-600 text-white border-red-600';
        infoBox.classList.remove('hidden');
        phoneField.classList.remove('hidden');
        addressField.classList.remove('hidden');
        badge.innerText = `🛵 เดลิเวอรี่`;
      }
      checkLiveOrderStatus();
    }

    // โหลดชื่อร้าน
    async function loadShopName() {
      const { data } = await supabaseClient.from('settings').select('value').eq('key', 'shop_name').single();
      if (data && data.value) {
        document.getElementById('shop-title').innerText = `🍜 ${data.value}`;
      } else {
        document.getElementById('shop-title').innerText = `🍜 ร้านอาหาร`;
      }
    }

    async function loadMenus() {
      const menuListEl = document.getElementById('menu-list');
      const { data, error } = await supabaseClient.from('menus').select('*');

      if (error) {
        menuListEl.innerHTML = `<p class="text-red-500 text-center">เกิดข้อผิดพลาดในการโหลดเมนู</p>`;
        return;
      }

      menusData = data || [];
      renderFilteredMenus();
    }

    // 📌 ระบบ Tracking อัปเดตสถานะและคิวแบบเรียลไทม์ (แก้ไขตัวเทียบค่าให้ตรงกันเป๊ะ)
    async function checkLiveOrderStatus() {
      const container = document.getElementById('live-order-status-container');
      
      let targetQueryNo = tableNo;
      if (orderMode === 'takeaway') targetQueryNo = '🛍️ กลับบ้าน';
      if (orderMode === 'delivery') targetQueryNo = '🛵 เดลิเวอรี่';

      const { data, error } = await supabaseClient
        .from('orders')
        .select('*')
        .eq('table_no', targetQueryNo)
        .in('status', ['new', 'cooking', 'ready'])
        .order('id', { ascending: false })
        .limit(1);

      if (error || !data || data.length === 0) {
        container.classList.add('hidden');
        return;
      }

      const order = data[0];
      container.classList.remove('hidden');

      document.getElementById('order-id-label').innerText = `ออร์เดอร์ #${order.id}`;
      document.getElementById('order-total-label').innerText = order.total_price;

      let badgeHtml = '';
      if (order.status === 'new' || order.status === 'cooking') {
        const { count } = await supabaseClient
          .from('orders')
          .select('*', { count: 'exact', head: true })
          .in('status', ['new', 'cooking'])
          .lt('id', order.id);

        const queuePosition = (count || 0) + 1;

        if (order.status === 'new') {
          badgeHtml = `<span class="bg-yellow-100 text-yellow-800 px-2.5 py-1 rounded-full text-xs font-bold">⏳ รอห้องครัวรับเรื่อง</span>`;
        } else {
          badgeHtml = `<span class="bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full text-xs font-bold">🔥 กำลังทำอาหาร</span>`;
        }

        document.getElementById('queue-title-label').innerText = `ลำดับคิวในครัว`;
        document.getElementById('queue-number-text').innerText = `คิวที่ #${queuePosition}`;

      } else if (order.status === 'ready') {
        badgeHtml = `<span class="bg-green-100 text-green-800 px-2.5 py-1 rounded-full text-xs font-bold">🎉 อาหารพร้อมรับแล้ว!</span>`;
        document.getElementById('queue-title-label').innerText = `สถานะคิว`;
        document.getElementById('queue-number-text').innerText = `พร้อมแล้ว`;
      }
      document.getElementById('order-status-badge').innerHTML = badgeHtml;

      let itemsList = [];
      try {
        itemsList = typeof order.items === 'string' ? JSON.parse(order.items) : order.items;
      } catch (e) {
        itemsList = [];
      }

      let itemsSummaryHtml = '';
      if (Array.isArray(itemsList)) {
        itemsList.forEach(item => {
          itemsSummaryHtml += `
            <div class="border-b pb-1 mb-1 last:border-b-0">
              <span class="font-bold">• ${item.menu_name} x ${item.quantity}</span> 
              <span class="text-gray-500">(${item.noodle || '-'} / ${item.soup || '-'})</span>
              ${item.note ? `<div class="text-red-600 font-medium pl-3">💬 หมายเหตุ: ${item.note}</div>` : ''}
            </div>
          `;
        });
      }
      document.getElementById('order-items-summary').innerHTML = itemsSummaryHtml;
    }

    function filterCategory(category, btnElement) {
      currentCategory = category;
      document.getElementById('category-title').innerText = `เมนู${category}`;
      
      document.querySelectorAll('.category-btn').forEach(btn => {
        btn.classList.remove('bg-red-600', 'text-white');
        btn.classList.add('bg-white', 'text-gray-700');
      });
      btnElement.classList.remove('bg-white', 'text-gray-700');
      btnElement.classList.add('bg-red-600', 'text-white');

      renderFilteredMenus();
    }

    function renderFilteredMenus() {
      const menuListEl = document.getElementById('menu-list');
      const filtered = menusData.filter(m => (m.category || 'ก๋วยเตี๋ยว') === currentCategory && m.is_available !== false);

      if (filtered.length === 0) {
        menuListEl.innerHTML = `<p class="text-gray-400 text-center py-8">ยังไม่มีเมนูในหมวดหมู่นี้</p>`;
        return;
      }

      menuListEl.innerHTML = '';
      filtered.forEach(menu => {
        menuListEl.innerHTML += `
          <div class="bg-white rounded-xl p-4 shadow flex items-center justify-between">
            <div class="flex items-center space-x-4">
              <img src="${menu.image_url || 'https://via.placeholder.com/150'}" class="w-20 h-20 object-cover rounded-lg shadow-sm">
              <div>
                <h3 class="font-bold text-gray-800 text-lg">${menu.name}</h3>
                <p class="text-red-600 font-bold">฿${menu.price}</p>
              </div>
            </div>
            <button onclick="openModalById('${menu.id}')" class="bg-red-600 text-white px-4 py-2 rounded-lg font-bold shadow hover:bg-red-700 transition">
              เลือกสั่ง
            </button>
          </div>
        `;
      });
    }

    function openModalById(menuId) {
      const menu = menusData.find(m => m.id == menuId);
      if (!menu) return;
      currentMenu = menu;

      document.getElementById('modal-title').innerText = `ปรับแต่ง: ${menu.name}`;

      const noodleContainer = document.getElementById('noodle-options');
      noodleContainer.innerHTML = '';
      if (menu.noodles) {
        const noodlesArray = menu.noodles.replace(/[,/]/g, '|').split('|');
        noodlesArray.forEach((item, index) => {
          const trimmed = item.trim();
          if (trimmed) {
            noodleContainer.innerHTML += `
              <label class="flex items-center space-x-3 cursor-pointer">
                <input type="radio" name="noodle" value="${trimmed}" ${index === 0 ? 'checked' : ''} class="w-4 h-4 text-red-600">
                <span class="text-gray-700">${trimmed}</span>
              </label>`;
          }
        });
      } else {
        noodleContainer.innerHTML = `<span class="text-gray-400 text-sm">ไม่มีตัวเลือกเส้น</span><input type="hidden" name="noodle" value="-">`;
      }

      const soupContainer = document.getElementById('soup-options');
      soupContainer.innerHTML = '';
      if (menu.soups) {
        const soupsArray = menu.soups.replace(/[,/]/g, '|').split('|');
        soupsArray.forEach((item, index) => {
          const trimmed = item.trim();
          if (trimmed) {
            soupContainer.innerHTML += `
              <label class="flex items-center space-x-3 cursor-pointer">
                <input type="radio" name="soup" value="${trimmed}" ${index === 0 ? 'checked' : ''} class="w-4 h-4 text-red-600">
                <span class="text-gray-700">${trimmed}</span>
              </label>`;
          }
        });
      } else {
        soupContainer.innerHTML = `<span class="text-gray-400 text-sm">ไม่มีตัวเลือกน้ำซุป</span><input type="hidden" name="soup" value="-">`;
      }

      document.getElementById('item-quantity').value = 1;
      document.getElementById('customer-note').value = '';
      updateModalPrice();

      document.getElementById('custom-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('custom-modal').classList.add('hidden');
    }

    function adjustQty(amount) {
      const qtyInput = document.getElementById('item-quantity');
      let val = parseInt(qtyInput.value) || 1;
      val += amount;
      if (val < 1) val = 1;
      qtyInput.value = val;
      updateModalPrice();
    }

    function updateModalPrice() {
      const qty = parseInt(document.getElementById('item-quantity').value) || 1;
      const total = currentMenu.price * qty;
      document.getElementById('add-to-cart-btn').innerText = `เพิ่มลงตะกร้า (฿${total})`;
    }

    function addToCart() {
      const selectedNoodle = document.querySelector('input[name="noodle"]:checked')?.value || '-';
      const selectedSoup = document.querySelector('input[name="soup"]:checked')?.value || '-';
      const quantity = parseInt(document.getElementById('item-quantity').value) || 1;
      const note = document.getElementById('customer-note').value.trim();
      const totalPrice = currentMenu.price * quantity;

      const cartItem = {
        menu_id: currentMenu.id,
        menu_name: currentMenu.name,
        price_per_unit: currentMenu.price,
        quantity: quantity,
        total_price: totalPrice,
        noodle: selectedNoodle,
        soup: selectedSoup,
        note: note
      };

      cart.push(cartItem);
      updateFloatingCart();
      closeModal();
      alert('เพิ่มลงตะกร้าแล้ว!');
    }

    function updateFloatingCart() {
      const floatingCart = document.getElementById('floating-cart');
      const cartCount = document.getElementById('cart-count');
      const cartTotal = document.getElementById('cart-total');

      if (cart.length === 0) {
        floatingCart.classList.add('hidden');
        return;
      }

      let totalQty = cart.reduce((sum, item) => sum + item.quantity, 0);
      let totalPrice = cart.reduce((sum, item) => sum + item.total_price, 0);

      cartCount.innerText = totalQty;
      cartTotal.innerText = totalPrice;
      floatingCart.classList.remove('hidden');
    }

    function openCartModal() {
      const container = document.getElementById('cart-items-container');
      container.innerHTML = '';

      if (cart.length === 0) {
        container.innerHTML = `<p class="text-gray-400 text-center py-8">ไม่มีสินค้าในตะกร้า</p>`;
        return;
      }

      let grandTotal = 0;
      cart.forEach((item, index) => {
        grandTotal += item.total_price;
        container.innerHTML += `
          <div class="bg-gray-50 border rounded-xl p-3 flex justify-between items-center">
            <div>
              <h4 class="font-bold text-gray-800">${item.menu_name} x ${item.quantity}</h4>
              <p class="text-xs text-gray-500">เส้น: ${item.noodle} | ซุป: ${item.soup}</p>
              ${item.note ? `<p class="text-xs text-red-600 font-medium mt-0.5">💬 หมายเหตุ: ${item.note}</p>` : ''}
              <p class="text-sm font-bold text-red-600 mt-1">฿${item.total_price}</p>
            </div>
            <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 text-sm font-bold px-2 py-1">ลบ</button>
          </div>
        `;
      });

      document.getElementById('cart-modal-total').innerText = grandTotal;
      document.getElementById('cart-modal').classList.remove('hidden');
    }

    function closeCartModal() {
      document.getElementById('cart-modal').classList.add('hidden');
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateFloatingCart();
      openCartModal();
    }

    async function submitAllOrders() {
      if (cart.length === 0) return;

      let finalTableNo = tableNo;
      let customerInfoPrefix = '';

      if (orderMode === 'takeaway') {
        const name = document.getElementById('cust-name').value.trim();
        if (!name) {
          alert('กรุณากรอกชื่อผู้สั่งสำหรับกลับบ้านครับ');
          return;
        }
        finalTableNo = '🛍️ กลับบ้าน';
        customerInfoPrefix = `[ผู้สั่ง: ${name}]`;
      } else if (orderMode === 'delivery') {
        const name = document.getElementById('cust-name').value.trim();
        const phone = document.getElementById('cust-phone').value.trim();
        const address = document.getElementById('cust-address').value.trim();
        if (!name || !phone || !address) {
          alert('กรุณากรอกชื่อ เบอร์โทร และที่อยู่จัดส่งให้ครบถ้วนครับ');
          return;
        }
        finalTableNo = '🛵 เดลิเวอรี่';
        customerInfoPrefix = `[เดลิเวอรี่ - ชื่อ: ${name} | โทร: ${phone} | ที่อยู่: ${address}]`;
      }

      if (customerInfoPrefix && cart.length > 0) {
        cart[0].note = customerInfoPrefix + ' ' + (cart[0].note || '');
      }

      let grandTotal = cart.reduce((sum, item) => sum + item.total_price, 0);

      const { error } = await supabaseClient.from('orders').insert([{
        table_no: finalTableNo,
        items: cart,
        total_price: grandTotal,
        status: 'new'
      }]);

      if (error) {
        alert('เกิดข้อผิดพลาดในการสั่งซื้อ: ' + error.message);
      } else {
        alert('สั่งอาหารสำเร็จ! ส่งรายการเข้าครัวเรียบร้อย');
        cart = [];
        updateFloatingCart();
        closeCartModal();
        checkLiveOrderStatus(); // เรียกเช็กสถานะทันทีหลังกดส่ง
      }
    }

    function setupCustomerRealtime() {
      supabaseClient
        .channel('customer-order-status')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'orders' }, payload => {
          checkLiveOrderStatus();
        })
        .subscribe();
    }

    // เริ่มทำงานทั้งหมด
    loadShopName();
    loadMenus();
    checkLiveOrderStatus();
    setupCustomerRealtime();

    setInterval(checkLiveOrderStatus, 5000);
  </script>
</body>
