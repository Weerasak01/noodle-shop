<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการเมนูอาหาร (Admin)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-lg space-y-6">
        
        <h1 class="text-2xl font-bold text-red-600 text-center">🍜 ระบบจัดการร้าน & เมนูอาหาร</h1>

        <!-- เพิ่มช่องตั้งชื่อร้านตรงนี้ (ไม่กระทบของเดิม) -->
        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-3">
            <h2 class="text-sm font-bold text-gray-700">⚙️ ตั้งค่าชื่อร้าน</h2>
            <div class="flex gap-2">
                <input type="text" id="shop-name-input" class="flex-1 border rounded-xl px-3 py-2 text-sm font-bold" placeholder="ชื่อร้าน">
                <button onclick="updateShopName()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-xl text-sm transition">
                    บันทึกชื่อร้าน
                </button>
            </div>
        </div>

        <!-- ฟอร์มเพิ่มเมนูเดิมของคุณ -->
        <form id="menu-form" onsubmit="addMenu(event)" class="space-y-4 border-t pt-4">
            <h2 class="text-lg font-bold text-gray-800">➕ เพิ่มเมนูใหม่</h2>
            <div>
                <label class="block text-sm font-medium text-gray-700">ชื่อเมนู</label>
                <input type="text" id="name" required class="w-full mt-1 border rounded-lg p-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">ราคา (บาท)</label>
                <input type="number" id="price" required class="w-full mt-1 border rounded-lg p-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">รูปภาพเมนู</label>
                <input type="file" id="imageFile" accept="image/*" class="w-full mt-1 border rounded-lg p-2">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">ตัวเลือกเส้น (คั่นด้วย ,)</label>
                <input type="text" id="noodles" class="w-full mt-1 border rounded-lg p-2" placeholder="เส้นเล็ก, เส้นใหญ่, บะหมี่">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">ตัวเลือกน้ำซุป/แบบ (คั่นด้วย ,)</label>
                <input type="text" id="soups" class="w-full mt-1 border rounded-lg p-2" placeholder="น้ำใส, ต้มยำ, แห้ง">
            </div>
            <button type="submit" class="w-full bg-red-600 text-white py-2 rounded-lg font-bold hover:bg-red-700 transition">
                บันทึกเมนู
            </button>
        </form>

        <!-- รายการเมนูเดิมของคุณ -->
        <div class="border-t pt-4">
            <h2 class="text-lg font-bold text-gray-800 mb-2">📋 รายการเมนูทั้งหมด</h2>
            <div id="menu-list" class="space-y-2"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bofbcqfavxbydzmfhhdi.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvZmJjcWZhdnhieWR6bWZoaGRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNzgyNDMsImV4cCI6MjEwODY1NDI0M30.NazP38z1ligYp9S0gChRZs9JYNabN6YX4akJe84ai7o';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // โหลดชื่อร้าน
        async function loadShopName() {
            const { data } = await supabaseClient.from('settings').select('value').eq('key', 'shop_name').single();
            if (data) document.getElementById('shop-name-input').value = data.value;
        }

        // บันทึกชื่อร้าน
        async function updateShopName() {
            const newName = document.getElementById('shop-name-input').value.trim();
            if (!newName) return alert('กรุณากรอกชื่อร้าน');
            const { error } = await supabaseClient.from('settings').upsert({ key: 'shop_name', value: newName }, { onConflict: 'key' });
            if (error) alert('บันทึกไม่สำเร็จ: ' + error.message);
            else alert('อัปเดตชื่อร้านเรียบร้อย!');
        }

        // ฟังก์ชันเดิมของคุณ (โหลดเมนู, เพิ่มเมนู, ลบเมนู ฯลฯ ตามไฟล์ต้นฉบับ)
        async function fetchMenus() {
            const { data, error } = await supabaseClient.from('menus').select('*').order('id', { ascending: false });
            const listEl = document.getElementById('menu-list');
            if (error) {
                listEl.innerHTML = '<p class="text-red-500">โหลดเมนูไม่สำเร็จ</p>';
                return;
            }
            listEl.innerHTML = '';
            data.forEach(m => {
                listEl.innerHTML += `
                    <div class="flex justify-between items-center border p-3 rounded-lg bg-gray-50">
                        <div class="flex items-center gap-3">
                            <img src="${m.image_url || 'https://via.placeholder.com/150'}" class="w-12 h-12 object-cover rounded-md">
                            <div>
                                <p class="font-bold">${m.name}</p>
                                <p class="text-sm text-red-600 font-bold">฿${m.price}</p>
                            </div>
                        </div>
                        <button onclick="deleteMenu('${m.id}')" class="bg-red-100 text-red-600 px-3 py-1 rounded-lg text-sm font-bold hover:bg-red-200">ลบ</button>
                    </div>
                `;
            });
        }

        async function addMenu(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const price = parseFloat(document.getElementById('price').value);
            const noodles = document.getElementById('noodles').value;
            const soups = document.getElementById('soups').value;
            const fileInput = document.getElementById('imageFile').files[0];
            let imageUrl = '';

            if (fileInput) {
                const fileName = `menu_${Date.now()}_${fileInput.name}`;
                const { data, error } = await supabaseClient.storage.from('menu-images').upload(fileName, fileInput);
                if (!error) {
                    const { data: publicUrlData } = supabaseClient.storage.from('menu-images').getPublicUrl(fileName);
                    imageUrl = publicUrlData.publicUrl;
                }
            }

            const { error } = await supabaseClient.from('menus').insert([{ name, price, noodles, soups, image_url: imageUrl }]);
            if (error) alert('เพิ่มเมนูไม่สำเร็จ: ' + error.message);
            else {
                alert('เพิ่มเมนูสำเร็จ!');
                document.getElementById('menu-form').reset();
                fetchMenus();
            }
        }

        async function deleteMenu(id) {
            if (!confirm('ยืนยันการลบเมนูนี้?')) return;
            const { error } = await supabaseClient.from('menus').delete().eq('id', id);
            if (!error) fetchMenus();
        }

        // เริ่มต้นทำงาน
        loadShopName();
        fetchMenus();
    </script>
</body>
</html>
