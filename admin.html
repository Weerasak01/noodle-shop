<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการเมนูอาหาร (Admin)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-2xl mx-auto bg-white p-6 rounded-2xl shadow-lg space-y-6">
        
        <h1 class="text-2xl font-bold text-red-600 text-center">🍜 ระบบจัดการร้าน & เมนูอาหาร</h1>

        <!-- ตั้งค่าชื่อร้าน -->
        <div class="bg-gray-50 p-4 rounded-xl border border-gray-200 space-y-3">
            <h2 class="text-sm font-bold text-gray-700">⚙️ ตั้งค่าชื่อร้าน</h2>
            <div class="flex gap-2">
                <input type="text" id="shop-name-input" class="flex-1 border rounded-xl px-3 py-2 text-sm font-bold" placeholder="ชื่อร้าน">
                <button type="button" onclick="updateShopName()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-2 rounded-xl text-sm transition">
                    บันทึกชื่อร้าน
                </button>
            </div>
        </div>

        <!-- ฟอร์มเพิ่ม / แก้ไขเมนู -->
        <form id="menu-form" onsubmit="saveMenu(event)" class="space-y-4 border-t pt-4">
            <div class="flex justify-between items-center">
                <h2 id="form-title" class="text-lg font-bold text-gray-800">➕ เพิ่มเมนูใหม่</h2>
                <button type="button" id="cancel-edit-btn" onclick="resetForm()" class="hidden text-xs bg-gray-200 hover:bg-gray-300 px-3 py-1 rounded-lg font-bold text-gray-700">ยกเลิกแก้ไข</button>
            </div>
            
            <input type="hidden" id="edit-id">

            <div>
                <label class="block text-sm font-medium text-gray-700">ชื่อเมนู</label>
                <input type="text" id="name" required class="w-full mt-1 border rounded-lg p-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">ราคา (บาท)</label>
                <input type="number" id="price" required class="w-full mt-1 border rounded-lg p-2 text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">รูปภาพเมนู</label>
                <input type="file" id="imageFile" accept="image/*" class="w-full mt-1 border rounded-lg p-2 text-sm">
                <p class="text-xs text-gray-400 mt-1">* หากแก้ไขเมนูแล้วไม่เลือกรูปใหม่ ระบบจะใช้รูปเดิมโดยอัตโนมัติ</p>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">ตัวเลือกเส้น (คั่นด้วย ,)</label>
                <input type="text" id="noodles" class="w-full mt-1 border rounded-lg p-2 text-sm" placeholder="เส้นเล็ก, เส้นใหญ่, บะหมี่">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">ตัวเลือกน้ำซุป/แบบ (คั่นด้วย ,)</label>
                <input type="text" id="soups" class="w-full mt-1 border rounded-lg p-2 text-sm" placeholder="น้ำใส, ต้มยำ, แห้ง">
            </div>
            <button type="submit" id="submit-btn" class="w-full bg-red-600 text-white py-2.5 rounded-lg font-bold hover:bg-red-700 transition">
                บันทึกเมนู
            </button>
        </form>

        <!-- รายการเมนูทั้งหมด -->
        <div class="border-t pt-4">
            <h2 class="text-lg font-bold text-gray-800 mb-2">📋 รายการเมนูทั้งหมด</h2>
            <div id="menu-list" class="space-y-2"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bofbcqfavxbydzmfhhdi.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJvZmJjcWZhdnhieWR6bWZoaGRpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMwNzgyNDMsImV4cCI6MjEwODY1NDI0M30.NazP38z1ligYp9S0gChRZs9JYNabN6YX4akJe84ai7o';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let menusCache = [];
        let currentEditingImageUrl = '';

        async function loadShopName() {
            const { data } = await supabaseClient.from('settings').select('value').eq('key', 'shop_name').single();
            if (data) document.getElementById('shop-name-input').value = data.value;
        }

        async function updateShopName() {
            const newName = document.getElementById('shop-name-input').value.trim();
            if (!newName) return alert('กรุณากรอกชื่อร้าน');
            const { error } = await supabaseClient.from('settings').upsert({ key: 'shop_name', value: newName }, { onConflict: 'key' });
            if (error) alert('บันทึกไม่สำเร็จ: ' + error.message);
            else alert('อัปเดตชื่อร้านเรียบร้อย!');
        }

        async function fetchMenus() {
            const { data, error } = await supabaseClient.from('menus').select('*').order('id', { ascending: false });
            const listEl = document.getElementById('menu-list');
            if (error) {
                listEl.innerHTML = '<p class="text-red-500 text-sm">โหลดเมนูไม่สำเร็จ</p>';
                return;
            }
            menusCache = data || [];
            listEl.innerHTML = '';
            
            if (menusCache.length === 0) {
                listEl.innerHTML = '<p class="text-gray-400 text-center text-sm py-4">ยังไม่มีเมนูอาหาร</p>';
                return;
            }

            menusCache.forEach(m => {
                listEl.innerHTML += `
                    <div class="flex justify-between items-center border p-3 rounded-xl bg-gray-50 gap-3">
                        <div class="flex items-center gap-3 min-w-0">
                            <img src="${m.image_url || 'https://via.placeholder.com/150'}" class="w-12 h-12 object-cover rounded-lg shadow-sm">
                            <div class="min-w-0">
                                <p class="font-bold text-sm truncate">${m.name}</p>
                                <p class="text-xs text-red-600 font-bold">฿${m.price}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5 shrink-0">
                            <button onclick="startEditMenu('${m.id}')" class="bg-amber-100 text-amber-700 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-amber-200 transition">แก้ไข</button>
                            <button onclick="deleteMenu('${m.id}')" class="bg-red-100 text-red-600 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-red-200 transition">ลบ</button>
                        </div>
                    </div>
                `;
            });
        }

        // ฟังก์ชันบันทึก (รองรับทั้งเพิ่มใหม่ และแก้ไข พร้อมรูปภาพ)
        async function saveMenu(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-id').value;
            const name = document.getElementById('name').value.trim();
            const price = parseFloat(document.getElementById('price').value) || 0;
            const noodles = document.getElementById('noodles').value.trim();
            const soups = document.getElementById('soups').value.trim();
            
            let imageUrl = currentEditingImageUrl;
            const fileInput = document.getElementById('imageFile').files[0];

            if (fileInput) {
                const fileName = `menu_${Date.now()}_${fileInput.name}`;
                const { data, error } = await supabaseClient.storage.from('menu-images').upload(fileName, fileInput);
                if (error) {
                    alert('อัปโหลดรูปภาพไม่สำเร็จ: ' + error.message);
                    return;
                }
                const { data: publicUrlData } = supabaseClient.storage.from('menu-images').getPublicUrl(fileName);
                imageUrl = publicUrlData.publicUrl;
            }

            const payload = { name, price, noodles, soups, image_url: imageUrl };

            if (editId) {
                // แก้ไขข้อมูลเดิม
                const { error } = await supabaseClient.from('menus').update(payload).eq('id', editId);
                if (error) {
                    alert('แก้ไขเมนูไม่สำเร็จ: ' + error.message);
                } else {
                    alert('แก้ไขเมนูสำเร็จ!');
                    resetForm();
                    fetchMenus();
                }
            } else {
                // เพิ่มเมนูใหม่
                const { error } = await supabaseClient.from('menus').insert([payload]);
                if (error) {
                    alert('เพิ่มเมนูไม่สำเร็จ: ' + error.message);
                } else {
                    alert('เพิ่มเมนูสำเร็จ!');
                    resetForm();
                    fetchMenus();
                }
            }
        }

        function startEditMenu(id) {
            const menu = menusCache.find(m => String(m.id) === String(id));
            if (!menu) return;

            document.getElementById('edit-id').value = menu.id;
            document.getElementById('name').value = menu.name;
            document.getElementById('price').value = menu.price;
            document.getElementById('noodles').value = menu.noodles || '';
            document.getElementById('soups').value = menu.soups || '';
            
            currentEditingImageUrl = menu.image_url || '';
            
            document.getElementById('form-title').innerText = '✏️ แก้ไขเมนู: ' + menu.name;
            document.getElementById('submit-btn').innerText = 'บันทึกการแก้ไข';
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('edit-id').value = '';
            document.getElementById('menu-form').reset();
            currentEditingImageUrl = '';
            document.getElementById('form-title').innerText = '➕ เพิ่มเมนูใหม่';
            document.getElementById('submit-btn').innerText = 'บันทึกเมนู';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        async function deleteMenu(id) {
            if (!confirm('ยืนยันการลบเมนูนี้?')) return;
            const { error } = await supabaseClient.from('menus').delete().eq('id', id);
            if (!error) fetchMenus();
            else alert('ลบไม่สำเร็จ: ' + error.message);
        }

        loadShopName();
        fetchMenus();
    </script>
</body>
</html>
